<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>潔諾的委託排單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style id="css">
/* Style follows 潔諾 Jessroin site: pale pink dotted ground, cocoa outlines, pill buttons with berry under-shadow, rounded white cards. */
:root{
  --berry:#C2456B; --pink:#FFC2D1; --pink-deep:#FF8FAB; --blush:#FFE6EC; --paper:#FFF4F7; --card:#FFFFFF;
  --butter:#FFE8A3; --butter-soft:#FFF4CC; --sky:#BFE6F7; --sky-soft:#DDF1FB;
  --ink:#5A2E3E; --muted:#94697A; --line:#F6CFDA;
  --sweet:var(--pink-deep);
  --ok:#2F6E8C; --warn:#8A6410; --bad:#C2456B;
  --edge:1.5px solid var(--ink);
  --soft:0 14px 34px rgba(245,138,166,.22);
  --display:"Zen Maru Gothic","jf-openhuninn-2.0","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:var(--display);
  --r:26px; --r2:16px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{height:100%}
html,body{margin:0;overflow-x:hidden}
body{background-color:var(--paper);
  background-image:radial-gradient(rgba(255,160,185,.42) 1.5px,transparent 1.5px),radial-gradient(circle at 0 12%,rgba(191,230,247,.45),transparent 32%),radial-gradient(circle at 100% 38%,rgba(255,232,163,.45),transparent 30%),radial-gradient(circle at 0 78%,rgba(255,232,163,.35),transparent 28%),radial-gradient(circle at 100% 92%,rgba(191,230,247,.4),transparent 30%);
  background-size:26px 26px,100% 100%,100% 100%,100% 100%,100% 100%;
  color:var(--ink);font-family:var(--body);font-weight:500;font-size:16px;line-height:1.65;min-height:100%;display:flex;flex-direction:column}
#root{flex:1;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--berry);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
/* header */
header.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:var(--edge)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap}
.brand{text-decoration:none;font-weight:700;font-size:22px;color:var(--berry);margin-right:auto;line-height:1.2;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand small{font-size:14px;color:var(--ink);font-weight:500}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end;order:2}
nav.tabs a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:700;font-size:15px}
nav.tabs a:hover{background:var(--blush)}
nav.tabs a[aria-current="page"]{color:var(--berry)}
nav.tabs a[aria-current="page"]{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
nav.tabs a.lock[aria-current="page"]{text-decoration:none;background:var(--blush)}
nav.tabs .lock{font-weight:500;font-size:14px;border:var(--edge);background:#fff}
.save{font-size:13px;color:var(--muted);text-align:right;order:1}
.save:empty{display:none}
.save.err{color:var(--bad)}
main{width:100%;max-width:1180px;margin:0 auto;padding:28px 22px 56px;display:flex;flex-direction:column;gap:26px}
h2{font-weight:700;font-size:28px;margin:0;color:var(--berry);text-wrap:balance;letter-spacing:.5px}
h2 small{font-size:14px;color:var(--muted);font-weight:500;margin-left:10px;letter-spacing:0}
h3{font-size:17px;margin:0;font-weight:700;color:var(--berry)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
/* buttons */
.btn{border:var(--edge);background:linear-gradient(180deg,#FFAFC4,#FF8DAC);color:var(--ink);border-radius:999px;padding:7px 18px;cursor:pointer;font-weight:700;font-size:15px;box-shadow:0 3px 0 var(--berry);transition:transform .12s,box-shadow .12s;white-space:nowrap}
.btn:hover,.btn:focus-visible{transform:translateY(2px);box-shadow:0 1px 0 var(--berry)}
.btn.primary{background:linear-gradient(180deg,#FFAFC4,#FF8DAC)}
.btn.ghost{background:#fff}
.btn.small{padding:3px 12px;font-size:13px;box-shadow:0 2px 0 var(--berry)}
.btn.small:hover{box-shadow:0 0 0 var(--berry)}
.btn.danger{background:#fff;color:var(--berry)}
.btn.danger.armed{background:var(--berry);color:#fff}
/* surfaces */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.tile{background:#fff;border:var(--edge);border-radius:var(--r);box-shadow:var(--soft);padding:16px 22px;display:flex;flex-direction:column;gap:2px}
.tile .k{font-size:14px;color:var(--muted)}
.tile .v{font-size:32px;font-weight:700;line-height:1.2;color:var(--ink)}
.tile .v.berry{color:var(--berry)}
.tile .s{font-size:13px;color:var(--muted)}
.panel{background:#fff;border:var(--edge);border-radius:var(--r);box-shadow:var(--soft);padding:20px 22px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;line-height:1.5;padding:1px 10px;border-radius:999px;background:var(--blush);color:var(--ink);white-space:nowrap;border:1px solid transparent;font-weight:500}
.chip.paid{background:var(--sky-soft);color:var(--ok);border-color:var(--sky)}
.chip.unpaid{background:#fff;border-color:var(--pink-deep);color:var(--berry)}
.chip.lic{background:var(--blush)}
.chip.lic.com{background:var(--pink);}
.chip.late{background:var(--berry);color:#fff}
.chip.soon{background:var(--butter);color:var(--warn)}
.chip.st-done{background:var(--sky-soft);color:var(--ok)}
.chip.st-active{background:var(--pink);color:var(--ink)}
.chip.st-paused,.chip.st-cancel{background:#fff;border-color:var(--line);color:var(--muted)}
.chip.tpl{background:var(--butter);color:var(--ink)}
.chip.k-normal{background:var(--pink);color:var(--ink)}
.chip.k-vt{background:var(--sky);color:var(--ink)}
/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(160px,1fr);gap:12px;overflow-x:auto;padding:4px 2px 8px}
.col{background:var(--blush);border:1.5px dashed var(--pink-deep);border-radius:var(--r2);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:110px}
.col-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px}
.col-h b{font-size:17px;font-weight:700;color:var(--berry)}
.col-h span{font-size:13px;color:var(--muted)}
.card{background:#fff;border:var(--edge);border-left-width:5px;border-left-color:var(--pink-deep);border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;width:100%;box-shadow:0 3px 0 var(--pink)}
.card:hover{transform:translateY(-1px)}
.card.late{border-left-color:var(--berry)}
.card.soon{border-left-color:#F2C14E}
.card .who{font-weight:700;font-size:15px}
.steps{display:flex;gap:4px;align-items:center}
.steps i{flex:1;height:8px;border-radius:4px;background:var(--blush);border:1px solid var(--pink)}
.steps i.on{background:var(--berry);border-color:var(--berry)}
.steps b{font-size:13px;color:var(--berry);margin-left:6px;min-width:38px;text-align:right}
.kanban.flow{grid-auto-columns:minmax(200px,1fr)}
.intro{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.intro b{color:var(--berry);font-size:17px}
.intro p{margin:4px 0 0;font-size:15px;max-width:60ch}
.intro .btn{text-decoration:none}
.qsec{display:flex;flex-direction:column;gap:14px}
.qsec h3 .cnt{font-size:14px;color:var(--muted);font-weight:500;margin-left:10px}
.qsec.doing{border-top:6px solid var(--pink-deep)}
.qsec.queue{border-top:6px solid #F2C14E}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.qcol.doing{background:var(--blush)}
.qcol.queue{background:var(--butter-soft);border-color:#F2C14E}
.qcard{cursor:default;gap:4px}
.qcard:hover{transform:none}
.qcard .what{font-size:14px;color:var(--ink);opacity:.85}
.qsec.queue .qcard{border-left-color:#F2C14E;box-shadow:0 3px 0 var(--butter)}
.qcard .when{font-size:13px;color:var(--muted)}
@media (max-width:560px){.qgrid{grid-template-columns:minmax(0,1fr)}}
.empty{font-size:14px;color:var(--muted);padding:6px 4px}
/* gantt */
.gantt{position:relative;overflow-x:auto}
.g-inner{min-width:620px;position:relative}
.g-axis{display:grid;font-size:13px;color:var(--muted);border-bottom:1.5px solid var(--ink);margin-left:150px}
.g-axis div{padding:4px 6px;border-left:1px dashed var(--line);white-space:nowrap;overflow:hidden}
.g-row{display:grid;grid-template-columns:150px 1fr;align-items:center;min-height:40px;border-bottom:1px dashed var(--line)}
.g-name{font-size:14px;padding-right:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-name small{display:block;color:var(--muted);font-size:12px}
.g-track{position:relative;height:40px}
.g-bar{position:absolute;top:11px;height:18px;border-radius:9px;background:var(--pink);border:1px solid var(--pink-deep);overflow:hidden}
.g-bar.est{background:repeating-linear-gradient(45deg,var(--blush) 0 6px,#fff 6px 10px);border:1px dashed var(--pink-deep)}
.g-fill{height:100%;background:var(--berry)}
.g-end{position:absolute;top:8px;width:4px;height:24px;border-radius:2px;background:var(--berry)}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:#E0A800;z-index:2}
.g-today span{position:absolute;top:-2px;left:4px;font-size:12px;color:var(--warn);white-space:nowrap;background:var(--butter-soft);padding:0 4px;border-radius:4px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:10px;border-radius:5px;margin-right:6px;vertical-align:middle}
.paybar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--blush);border:1px solid var(--pink)}
.paybar div{height:100%}
/* tables */
.tbl-wrap{overflow-x:auto;border:var(--edge);border-radius:var(--r2);background:#fff;box-shadow:var(--soft)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 9px;text-align:center;border-bottom:1px dashed var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:14px;color:var(--ink);font-weight:700;background:var(--pink);position:sticky;top:0;border-bottom:var(--edge)}
td.wrap{white-space:normal;min-width:160px}
tr:last-child td{border-bottom:none}
tbody tr:nth-child(even){background:#FFFAFB}
tbody tr:hover{background:var(--blush)}
td .mini{display:flex;gap:3px;align-items:center}
td .mini button{width:28px;height:26px;border-radius:8px;border:1px solid var(--pink-deep);background:#fff;color:var(--berry);font-size:13px;cursor:pointer;padding:0;font-weight:700}
td .mini button.on{background:var(--berry);border-color:var(--berry);color:#fff}
td .mini button.next{border:2px solid var(--ink);background:var(--butter-soft)}
td .mini button:disabled{cursor:not-allowed;border-color:var(--line);color:var(--line);background:#fff}
td .mini button.on:disabled{background:var(--berry);border-color:var(--berry);color:#fff;opacity:.85}
.pct{font-size:14px;font-weight:700;color:var(--berry);min-width:42px;text-align:right;margin-left:6px}
.toggle{border:none;background:none;padding:0;cursor:pointer}
.right{text-align:center}
td .mini{justify-content:center}
td.wrap{text-align:center}
table.main td,table.main th{text-align:center;vertical-align:middle}
table.main td .mini{justify-content:center}
table.main td>.chip,table.main td>.toggle{margin:0 auto}
a.link{color:var(--berry)}
.yeartabs{display:flex;gap:8px;flex-wrap:wrap}
.yeartabs button{border:var(--edge);background:#fff;border-radius:999px;padding:4px 16px;cursor:pointer;font-size:17px;font-weight:700;color:var(--ink)}
.yeartabs button[aria-pressed="true"]{background:linear-gradient(180deg,#FFAFC4,#FF8DAC);box-shadow:0 3px 0 var(--berry)}
.search{border:var(--edge);background:#fff;border-radius:999px;padding:7px 16px;min-width:220px}
.bars-wrap{overflow-x:auto}
.bars{display:grid;grid-template-columns:repeat(12,minmax(56px,1fr));gap:8px;align-items:end;height:220px;padding-top:8px;min-width:720px}
.bars .b{border:none;background:none;cursor:pointer;padding:4px 0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bars .b div{width:100%;max-width:38px;background:var(--pink);border:1px solid var(--pink-deep);border-radius:10px 10px 3px 3px;min-height:2px}
.bars .b span{font-size:13px;color:var(--ink)}
.bars .b small{font-size:12px;color:var(--muted)}
.bars .b em{font-style:normal;font-size:12px;font-weight:700;color:var(--ink)}
.bars .b:hover{background:var(--blush)}
.bars .b[aria-pressed="true"]{background:var(--butter-soft);outline:1.5px solid var(--ink)}
.bars .b[aria-pressed="true"] div{background:var(--berry);border-color:var(--berry)}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:18px}
.grid2>*{min-width:0}
.panel{min-width:0}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(90,46,62,.35);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto;z-index:20}
.modal{background:#fff;border:var(--edge);border-radius:var(--r);max-width:720px;width:100%;min-width:0;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--soft)}
.modal.narrow{max-width:420px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f input:not([type="checkbox"]),.f select,.f textarea{width:100%;min-width:0;max-width:100%}
.f.full{grid-column:1/-1}
.f label,.f .lbl{font-size:14px;color:var(--muted)}
.f input,.f select,.f textarea,.login input{border:1.5px solid var(--pink-deep);border-radius:12px;padding:8px 12px;background:#fff}
.f textarea{min-height:64px;resize:vertical}
fieldset{min-width:0;min-inline-size:0;border:1.5px dashed var(--pink-deep);border-radius:var(--r2);padding:10px 14px 14px;margin:0;display:flex;flex-direction:column;gap:8px}
legend{font-size:14px;color:var(--berry);font-weight:700;padding:0 6px}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks.f{flex-direction:row;flex-wrap:wrap;align-items:center}
.checks label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--pink-deep);border-radius:999px;padding:3px 12px;font-size:14px;cursor:pointer;color:var(--ink);background:#fff}
.checks input{accent-color:var(--berry)}
.calc{font-size:14px;color:var(--muted)}
.lines-empty{align-self:center;text-align:center;font-size:13px;color:var(--muted);border:1px dashed var(--pink-deep);border-radius:999px;padding:4px 16px;background:#fff;max-width:100%}
.notice{background:var(--butter-soft);border:1px solid var(--butter);border-radius:14px;padding:10px 14px;font-size:14px}
textarea.io{width:100%;min-height:180px;font-family:ui-monospace,monospace;font-size:12px;border:1.5px solid var(--pink-deep);border-radius:12px;padding:8px;background:#fff}
table.lines td,table.lines th{padding:6px 8px}
table.lines input,.f table.lines input{width:84px;border:1px solid var(--pink-deep);border-radius:8px;padding:4px 6px}
table.lines .ln-q,.f table.lines .ln-q{width:56px}
/* date picker */
.dpw{position:relative;display:flex}
.dpw input{flex:1;min-width:0;border-top-right-radius:0!important;border-bottom-right-radius:0!important}
.dpb{border:1.5px solid var(--pink-deep);border-left:none;background:var(--blush);color:var(--berry);border-radius:0 12px 12px 0;padding:0 10px;cursor:pointer;display:flex;align-items:center}
.dpb:hover{background:var(--pink)}
.dpop{position:absolute;top:calc(100% + 4px);left:0;z-index:30;background:#fff;border:var(--edge);border-radius:16px;box-shadow:var(--soft);padding:10px;width:264px}
.dpop .dph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:700;color:var(--berry)}
.dpop .dph button{border:none;background:var(--blush);color:var(--berry);width:30px;height:30px;border-radius:10px;cursor:pointer;font-size:16px}
.dpop .dpg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dpop .dpg span{font-size:12px;color:var(--muted);padding:2px 0}
.dpop .dpg button{border:none;background:none;height:32px;border-radius:10px;cursor:pointer;font-size:14px;color:var(--ink)}
.dpop .dpg button:hover{background:var(--blush)}
.dpop .dpg button.td{outline:1px solid var(--pink-deep)}
.dpop .dpg button.sel{background:var(--berry);color:#fff}
.dpop .dpf{display:flex;justify-content:space-between;margin-top:6px}
.dpop .dpf button{border:none;background:none;color:var(--berry);cursor:pointer;font-size:14px;padding:4px 6px}
form[data-kind="template"] .only-normal,form:not([data-kind="template"]) .only-template{display:none}
/* public detail + login */
.detail{display:flex;flex-direction:column;gap:10px}
.stagelist{display:flex;gap:6px;flex-wrap:wrap}
.stagelist span{border:1px solid var(--pink-deep);border-radius:999px;padding:2px 12px;font-size:14px;background:#fff;color:var(--muted)}
.stagelist span.on{background:var(--berry);border-color:var(--berry);color:#fff}
.stagelist span.cur{background:var(--butter);border-color:var(--ink);color:var(--ink);font-weight:700}
.login{display:flex;flex-direction:column;gap:12px;max-width:380px;margin:40px auto 0;width:100%}
.login .err{color:var(--berry);font-size:14px;min-height:1.4em}
footer.foot{margin-top:auto;background:var(--pink);position:relative;text-align:center;padding:14px 16px;font-size:14px;color:var(--ink)}
footer.foot::before{content:"";position:absolute;left:0;right:0;top:-12px;height:12px;background:radial-gradient(circle at 50% 100%,var(--pink) 11px,transparent 12px) 0 0/24px 12px repeat-x}
@media (prefers-reduced-motion:reduce){.btn,.card{transition:none}.btn:hover,.card:hover{transform:none}}
@media (max-width:560px){.form{grid-template-columns:minmax(0,1fr)}
  .scrim{padding:12px 8px}
  .modal{padding:16px 14px;gap:12px}
  .modal h2{font-size:23px}
  fieldset{padding:8px 10px 12px}
  .modal .f table.lines input{width:60px;padding:4px}
  .modal .f table.lines .ln-q{width:40px}
  .modal table.lines .btn.small{padding:2px 8px}
  .modal table.lines td.wrap{min-width:0;white-space:normal}
  .modal table.lines .chip{display:none}
  .dpop{left:auto;right:0}
  main{padding:20px 14px 44px;gap:22px}
  .top-in{padding:10px 14px;gap:6px 10px}
  .brand{font-size:20px}
  nav.tabs{width:100%}
  nav.tabs a{padding:4px 8px;font-size:14px}
  h2{font-size:24px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile{padding:12px 14px;border-radius:18px}
  .tile .k{font-size:13px}
  .tile .v{font-size:24px}
  .tile .s{font-size:12px}
  .search{min-width:0;width:100%}
  table.lines th:nth-child(4),table.lines td:nth-child(4){display:none}
  table.lines td,table.lines th{padding:6px 5px}
  .kanban{grid-auto-flow:row;grid-auto-columns:auto;grid-template-columns:minmax(0,1fr);overflow:visible}
  .col{min-height:0}
  .col .empty{padding:0 4px 2px}
  .col:has(.empty){padding:6px 10px}
  .col:has(.empty) .col-h{padding:0 4px}
  h2 small{display:block;margin:4px 0 0}
  .tbl-wrap:has(table.main){border:none;background:none;overflow:visible;box-shadow:none}
  table.main thead{display:none}
  table.main,table.main tbody{display:block}
  table.main tr{display:block;background:#fff!important;border:var(--edge);border-radius:var(--r2);padding:10px 14px;margin-bottom:12px;box-shadow:var(--soft)}
  table.main td{display:flex;justify-content:space-between;align-items:center;gap:12px;white-space:normal;border-bottom:1px dashed var(--line);padding:8px 0;text-align:right}
  table.main td.wrap{min-width:0}
  table.main td::before{content:attr(data-l);font-size:13px;color:var(--muted);text-align:left;flex:none}
  table.main td.c-who{font-size:18px;border-bottom:1.5px solid var(--ink)}
  table.main td.c-who::before{content:none}
  table.main td.c-edit{border-bottom:none;justify-content:flex-end;padding-bottom:0}
  table.main td.c-edit::before{content:none}
  table.main td .mini{flex-wrap:wrap;justify-content:flex-end}
}
</style>
</head>
<body>
<div id="root"></div>
<script id="pub" type="application/json">{"updated":"","items":[]}</script>
<script id="vault" type="application/json">null</script>

if(STATIC){try{var lr=JSON.parse(localStorage.getItem('jn-local')||'null');if(lr&&lr.vault&&lr.savedAt>FILE_AT){PUB=lr.pub;VAULT=lr.vault;LOCAL_AT=lr.savedAt;}}catch(e){}}

var ghState='',ghErr='',ghOpen=false,ghSha=null;
function gh(){return S&&S.settings&&S.settings.gh&&S.settings.gh.token?S.settings.gh:null;}
function ghUrl(g){return 'https://api.github.com/repos/'+encodeURIComponent(g.owner)+'/'+encodeURIComponent(g.repo)+'/contents/data.js';}
function ghFetch(g,method,body){
  return fetch(ghUrl(g)+(method==='GET'?'?ref='+encodeURIComponent(g.branch||'main')+'&t='+Date.now():''),{method:method,cache:'no-store',headers:{'Authorization':'Bearer '+g.token,'Accept':'application/vnd.github+json'},body:body?JSON.stringify(body):undefined})
    .then(function(r){var ex=r.headers.get('github-authentication-token-expiration');if(ex&&S&&S.settings&&S.settings.gh&&S.settings.gh.token===g.token){var d=ex.slice(0,10);if(/^\d{4}-\d{2}-\d{2}$/.test(d))S.settings.gh.expires=d;}return r.json().catch(function(){return {};}).then(function(j){if(!r.ok)throw {status:r.status,msg:j.message||('HTTP '+r.status)};return j;});});
}
function ghSync(){var g=gh();if(!STATIC||!g)return;

    if(d&&LOCAL_AT>(d.savedAt||0))persist();
  }).catch(function(e){ghErr=ghMsg(e);render();});}
function u8b64(s){return btoa(unescape(encodeURIComponent(s)));}
function b64u8(s){return decodeURIComponent(escape(atob(String(s).replace(/\s/g,''))));}
function ghPull(g){return ghFetch(g,'GET').then(function(j){ghSha=j.sha;var txt=b64u8(j.content),m=txt.match(/window\.JN_DATA=([\s\S]*);\s*$/);return m?JSON.parse(m[1]):null;});}
function ghPush(g,content,retry){
  var p=ghSha?Promise.resolve():ghFetch(g,'GET').then(function(j){ghSha=j.sha;},function(e){if(e.status!==404)throw e;});
  return p.then(function(){var body={message:'更新委託進度 '+new Date().toLocaleString('zh-TW'),content:u8b64(content),branch:g.branch||'main'};if(ghSha)body.sha=ghSha;return ghFetch(g,'PUT',body);})
    .then(function(j){ghSha=j.content&&j.content.sha;},function(e){if(!retry&&(e.status===409||e.status===422)){ghSha=null;return ghPush(g,content,true);}throw e;});
}
function ghMsg(e){var s=e&&e.status;return s===401?'權杖無效或已過期':s===403?'權杖沒有寫入權限':s===404?'找不到這個 repository':(e&&e.msg)||'連線失敗';}
function syncBar(){if(!STATIC||!unlocked())return '';

var S=null, KEY=null, viewing=null, loginErr='', loginBusy=false;

/* ---------- 後台加密：資料以密碼加密 (PBKDF2 + AES-GCM)，頁面原始碼裡沒有明文資料或密碼 ---------- */
function b64(buf){var s='',a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function unb64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function deriveKey(pw){return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(base){
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(VAULT.salt),iterations:VAULT.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);});}
function normalize(d){(d.orders||[]).forEach(function(o){if(o.kind==='template'&&(o.stages.length!==1||o.stages[0]!=='完')){var fin=o.status==='done'||o.done.indexOf('完')>=0;o.stages=['完'];o.done=fin?['完']:[];}});return d;}
function openVault(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(VAULT.iv)},key,unb64(VAULT.ct)).then(function(buf){return normalize(JSON.parse(new TextDecoder().decode(buf)));});}
function sealVault(){var iv=crypto.getRandomValues(new Uint8Array(12));
  return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},KEY,new TextEncoder().encode(JSON.stringify(S))).then(function(ct){return {v:1,iter:VAULT.iter,salt:VAULT.salt,iv:b64(iv),ct:b64(ct)};});}
function idb(){return new Promise(function(res,rej){try{var r=indexedDB.open('jessroin-commission',1);r.onupgradeneeded=function(){r.result.createObjectStore('k');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};}catch(e){rej(e);}});}
function idbDo(mode,fn){return idb().then(function(db){return new Promise(function(res,rej){var tx=db.transaction('k',mode),st=tx.objectStore('k'),q=fn(st);tx.oncomplete=function(){res(q&&q.result);};tx.onerror=function(){rej(tx.error);};});});}
function keySave(k){return idbDo('readwrite',function(st){return st.put(k,'key');}).catch(function(){});}
function keyLoad(){return idbDo('readonly',function(st){return st.get('key');}).catch(function(){return null;});}
function keyDrop(){return idbDo('readwrite',function(st){return st.delete('key');}).catch(function(){});}
function ssGet(k){try{return sessionStorage.getItem(k);}catch(e){return null;}}

/* 遮名字中間：字數不變，最多遮 5 個字，其餘頭尾平均保留 */
function maskName(s){var a=Array.from(String(s||'').trim()),n=a.length;if(n<=1)return a.join('');var m=n===2?1:Math.min(n-2,5),v=n-m,f=Math.ceil(v/2);return a.slice(0,f).join('')+'*'.repeat(m)+a.slice(f+m).join('');}

}

var root=document.getElementById('root');
var artifact=null, saveState='', saveTimer=null, histYear=null, histMonth=0, histQ='', editing=null, ioOpen=false;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function pd(s){if(!s)return null;var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function fmt(d){return d?(d.getMonth()+1)+'/'+d.getDate():'';}
function daysTo(s){var d=pd(s);return d?Math.round((d-today())/864e5):null;}
function doneCount(o){var n=0;while(n<o.stages.length&&o.done.indexOf(o.stages[n])>=0)n++;return n;}

/* ---------- persistence ---------- */
function buildDoc(){
  var css=document.getElementById('css').textContent;

  return '<!DOCTYPE html>\n<html lang="zh-Hant">\n<head>\n'+HEAD+'<style id="css">'+css+'</style>\n</head>\n<body>\n<div id="root"></div>\n<'+sc+' id="pub" type="application/json">'+j(PUB)+'</'+sc+'>\n<'+sc+' id="vault" type="application/json">'+j(VAULT)+'</'+sc+'>\n<'+sc+' id="app">'+app+'</'+sc+'>\n</body>\n</html>';
}
function markSave(t,err){saveState=t;var el=document.getElementById('save');if(el){el.textContent=t;el.className='save'+(err?' err':'');}}
function persist(){
  if(!unlocked())return;
  if(STATIC){markSave('儲存中…');clearTimeout(saveTimer);saveTimer=setTimeout(function(){
      sealVault().then(function(v){VAULT=v;PUB=pubData();LOCAL_AT=Date.now();
        try{localStorage.setItem('jn-local',JSON.stringify({pub:PUB,vault:VAULT,savedAt:LOCAL_AT}));}catch(e){}
        var g=gh();if(!g){markSave('已儲存');render();return;}
        markSave('更新到 GitHub…');
        return ghPush(g,dataFile()).then(function(){FILE_AT=LOCAL_AT;ghErr='';markSave('已更新');render();},function(e){ghErr=ghMsg(e);markSave('更新失敗',true);render();});
      });},800);return;}
  if(!artifact){markSave('目前無法儲存',true);return;}
  markSave('儲存中…');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    sealVault().then(function(v){VAULT=v;PUB=pubData();return keySave({k:KEY,t:Date.now(),view:view()});}).then(function(){return artifact.publish(buildDoc());}).then(function(){markSave('已儲存');},function(e){keyDrop();
      var c=e&&(e.code||e.message)||'';
      if(String(c).indexOf('conflict')>=0)markSave('已同步最新版本');
      else markSave('未能儲存（唯讀）',true);
    });
  },900);
}
function commit(){render();persist();}

function phase(o){return o.phase||(doneCount(o)===0?'queue':'doing');}
function slotLabel(o){var m=parseInt(o.slot,10);if(!m)return '排單月份未定';return '排單 '+(o.year&&o.year!==today().getFullYear()?o.year+' 年 ':'')+m+' 月';}

function pubList(){return (unlocked()?pubData().items:PUB.items).filter(function(o){return o.status==='active';});}
function boardView(){
  var A=pubList().sort(function(a,b){var x=(a.year||0)*100+(parseInt(a.slot,10)||99),y=(b.year||0)*100+(parseInt(b.slot,10)||99);return x-y||byDue(a,b);});

var FLOW=[['dep','訂金'],['draft','草稿'],['bal','尾款'],['line','線稿'],['final','完稿']];
function stDone(o,s){var p=o.stages.indexOf(s);return p<0||doneCount(o)>p;}
function adminStep(o){
  var tpl=o.kind==='template';
  if(tpl?!o.balancePaid:!o.depositPaid)return 'dep';
  if(!stDone(o,'構')||!stDone(o,'草'))return 'draft';
  if(!tpl&&!o.balancePaid)return 'bal';
  if(!stDone(o,'線'))return 'line';
  return 'final';
}
function nextStageName(o){var n=doneCount(o);return n<o.stages.length?o.stages[n]:null;}

function gantt(A){
  var items=A.map(function(o){
    var st=pd(o.orderDate), en=pd(o.due), est=false;
    if(!en){en=slotEnd(o);est=true;}
    return {o:o,st:st,en:en,est:est};
  }).filter(function(x){return x.en;});
  var h='<section class="panel" style="display:flex;flex-direction:column;gap:12px"><h3>交稿時間軸</h3>';
  if(!items.length)return h+'<div class="empty">還沒有任何委託設定交稿日或排單月份。</div></section>';
  var t=today();
  var min=new Date(Math.min.apply(null,items.map(function(x){return (x.st||x.en).getTime();}).concat([t.getTime()])));
  var max=new Date(Math.max.apply(null,items.map(function(x){return x.en.getTime();}).concat([t.getTime()+20*864e5])));
  min=new Date(min.getFullYear(),min.getMonth(),1); max=new Date(max.getFullYear(),max.getMonth()+1,1);
  var months=[];for(var d=new Date(min);d<max;d=new Date(d.getFullYear(),d.getMonth()+1,1))months.push(new Date(d));
  var span=max-min; function x(d){return ((d-min)/span*100).toFixed(2)+'%';}
  h+='<div class="gantt"><div class="g-inner"><div class="g-axis" style="grid-template-columns:repeat('+months.length+',1fr)">'+
    months.map(function(m){return '<div>'+(m.getMonth()===0||m===months[0]?m.getFullYear()+'/':'')+(m.getMonth()+1)+'月</div>';}).join('')+'</div>';
  items.sort(function(a,b){return a.en-b.en;}).forEach(function(it){
    var o=it.o, s=it.st||new Date(it.en.getTime()-14*864e5);
    var w=((it.en-s)/span*100);
    h+='<div class="g-row"><div class="g-name">'+esc(o.client)+'<small>'+esc(o.item)+'</small></div><div class="g-track">'+
      '<div class="g-bar'+(it.est?' est':'')+'" style="left:'+x(s)+';width:'+Math.max(w,1.5).toFixed(2)+'%" title="'+Math.round(prog(o)*100)+'% 完成"><div class="g-fill" style="width:'+Math.round(prog(o)*100)+'%"></div></div>'+
      '<div class="g-end" style="left:'+x(it.en)+';background:'+(it.en<t?'var(--bad)':'var(--berry)')+'"></div></div></div>';
  });
  h+='<div class="g-today" style="left:calc(160px + (100% - 160px) * '+((t-min)/span).toFixed(4)+')"><span>今天</span></div></div></div>';
  h+='<div class="legend"><span><i style="background:var(--berry)"></i>已完成比例</span><span><i style="background:color-mix(in srgb,var(--sweet) 45%,transparent)"></i>填單日 → 交稿日</span><span><i style="background:repeating-linear-gradient(45deg,var(--sweet) 0 4px,transparent 4px 7px)"></i>未定交稿日，以排單月底估計</span></div></section>';
  return h;
}

function calcLine(o){
  var sub=(o.lines||[]).reduce(function(s,l){return s+(l.c?l.p/2:l.p)*(l.q||1);},0);
  if(!sub&&!o.extra)return '授權倍率：普通商用 ×2、營利商用 ×3、非商買斷 ×3、商用買斷 ×5、全買斷 ×10（以非商業價格為基準）';
  return '非商底價 '+money(sub)+' × '+(o.license)+' ×'+(MULT[o.license]||1)+(ppl(o)>1?' × '+ppl(o)+' 人':'')+(o.rush?' × 急件 1.5':'')+(o.extra?' ＋ 加價 '+money(o.extra):'')+' ＝ <b style="color:var(--berry)">'+money(calcPrice(o))+'</b>'+(o.kind==='template'?'・模板一次付清全款':'・訂金 20% '+money(Math.round(calcPrice(o)*0.2))+'／尾款 80% '+money(calcPrice(o)-Math.round(calcPrice(o)*0.2)));
}

function normDate(s){s=String(s||'').trim();var m=s.match(/^(\d{4})\D?(\d{1,2})\D?(\d{1,2})$/);if(!m)return '';var d=new Date(+m[1],+m[2]-1,+m[3]);return isNaN(d)||d.getMonth()!==+m[2]-1?'':iso(d);}

  var dn=o.stages.filter(function(s){return F.querySelector('input[name="done"][value="'+s+'"]').checked;});o.done=o.stages.slice(0,o.stages.filter(function(s,i){return dn.indexOf(s)>=0&&o.stages.slice(0,i+1).every(function(x){return dn.indexOf(x)>=0;});}).length);
  o.kind=g('kind');o.pubName=g('pubName');o.hidePub=F.querySelector('[name="hidePub"]').checked;

function find(id){return S.orders.filter(function(o){return o.id===id;})[0];}
function advance(o){var n=doneCount(o);o.done=o.stages.slice(0,Math.min(n+1,o.stages.length));}
function deliver(o){o.done=o.stages.slice();o.status='done';o.delivered=iso(today());}
function stamp(o,k){if(o[k]){var dk=k==='depositPaid'?'depositDate':'balanceDate';if(!o[dk])o[dk]=iso(today());if(k==='balancePaid')o.depositPaid=true;}}

function render(){

root.addEventListener('click',function(e){
  var dpo=e.target.closest('[data-dpopen]');if(dpo){if(dp&&dp.id===dpo.dataset.dpopen)dpClose();else dpShow(dpo.dataset.dpopen);return;}
  var dd=e.target.closest('[data-dpday]');if(dd&&dp){dpSet(dd.dataset.dpday);return;}
  var dn=e.target.closest('[data-dpnav]');if(dn&&dp){dp.m+=+dn.dataset.dpnav;if(dp.m<0){dp.m=11;dp.y--;}if(dp.m>11){dp.m=0;dp.y++;}dpDraw();return;}
  if(e.target.closest('[data-dpclr]')&&dp){dpSet('');return;}
  if(e.target.closest('.dpop'))return;
  if(dp&&!e.target.classList.contains('dp'))dpClose();
  var t=e.target.closest('[data-step],[data-view],[data-month],[data-act],[data-edit],[data-adv],[data-deliver],[data-pay],[data-stage],[data-tog],[data-year]');
  if(!t){if(e.target.id==='scrim'){editing=null;viewing=null;render();}return;}
  var d=t.dataset;
  if(d.view){viewing=d.view;render();return;}
  if(d.step&&unlocked()){e.stopPropagation();var sp=d.step.split('|'),so=find(sp[0]);
    if(sp[1]==='pay'){if(so.kind==='template'||so.depositPaid){so.balancePaid=true;so.depositPaid=true;stamp(so,'balancePaid');if(so.kind==='template')so.depositDate=so.balanceDate;}else{so.depositPaid=true;stamp(so,'depositPaid');}}
    else if(sp[1]==='stage')advance(so);else if(sp[1]==='deliver')deliver(so);
    commit();return;}
  if(d.act==='logout'){e.preventDefault();S=null;KEY=null;editing=null;keyDrop();location.hash='#progress';render();return;}
  if(d.act==='close'&&viewing){viewing=null;render();return;}
  if(!unlocked()&&!d.year&&d.month===undefined)return;
  if(d.year){histYear=+d.year;histMonth=0;render();return;}
  if(d.month!==undefined){var mm=+d.month;histMonth=histMonth===mm?0:mm;render();return;}
  if(d.adv){e.stopPropagation();advance(find(d.adv));commit();return;}
  if(d.deliver){e.stopPropagation();deliver(find(d.deliver));commit();return;}
  if(d.pay){e.stopPropagation();var o=find(d.pay);if(o.kind==='template'){o.depositPaid=o.balancePaid=true;stamp(o,'balancePaid');o.depositDate=o.balanceDate;}else if(!o.depositPaid){o.depositPaid=true;stamp(o,'depositPaid');}else{o.balancePaid=true;stamp(o,'balancePaid');}commit();return;}
  if(d.stage){var p=d.stage.split('|'),o2=find(p[0]),i=+p[1],n=doneCount(o2);if(i===n)o2.done=o2.stages.slice(0,n+1);else if(i===n-1)o2.done=o2.stages.slice(0,n-1);commit();return;}
  if(d.tog){var q=d.tog.split('|'),o3=find(q[0]);if(q[1]==='full'){o3.balancePaid=o3.depositPaid=!o3.balancePaid;stamp(o3,'balancePaid');o3.depositDate=o3.balanceDate;commit();return;}o3[q[1]]=!o3[q[1]];stamp(o3,q[1]);commit();return;}
  if(d.edit){editing=JSON.parse(JSON.stringify(find(d.edit)));render();return;}
  switch(d.act){
    case 'dl':downloadData();break;
    case 'gh':ghOpen=!ghOpen;ghState='';if(ghOpen&&view()!=='orders'){location.hash='#orders';}render();break;
    case 'ghretry':ghErr='';persist();render();break;
    case 'ghoff':S.settings=S.settings||{};delete S.settings.gh;ghOpen=false;commit();break;
    case 'ghsave':
      var ng={owner:document.getElementById('gh-owner').value.trim(),repo:document.getElementById('gh-repo').value.trim(),branch:document.getElementById('gh-branch').value.trim()||'main',token:document.getElementById('gh-token').value.trim(),expires:normDate(document.getElementById('gh-exp').value)};
      var gm=document.getElementById('ghmsg');
      if(!ng.owner||!ng.repo||!ng.token){gm.textContent='請把帳號、Repository 和權杖都填好。';return;}
      gm.textContent='測試連線中…';ghSha=null;
      ghFetch(ng,'GET').then(function(j){ghSha=j.sha;return true;},function(e){if(e.status===404)return fetch('https://api.github.com/repos/'+encodeURIComponent(ng.owner)+'/'+encodeURIComponent(ng.repo),{headers:{'Authorization':'Bearer '+ng.token}}).then(function(r){if(!r.ok)throw {status:r.status};return true;});throw e;})
        .then(function(){S.settings=S.settings||{};S.settings.gh=ng;ghErr='';ghOpen=false;ghState='';commit();markSave('連線成功，更新到 GitHub…');},function(e){gm.textContent='連線失敗：'+ghMsg(e);});
      break;
    case 'new':editing=blank();render();break;
    case 'close':editing=null;render();break;
    case 'addline':
      var pk=document.getElementById('pick');if(!pk.value)return;var it=catItem(pk.value);readForm();
      editing.lines=editing.lines||[];editing.lines.push({n:it[0],p:it[1],q:1,c:!!it[2]});
      var auto=editing.lines.map(function(l){return l.n.replace(/（.*?）/g,'')+(l.q>1?'*'+l.q:'');}).join(', ');
      if(!editing.item||editing.item===editing._auto){editing.item=auto;}editing._auto=auto;
      if(it[3]&&!editing.due&&editing.orderDate){var dd=pd(editing.orderDate);dd.setDate(dd.getDate()+it[3]*7);editing.due=iso(dd);}
      if(editing.autoPrice){editing.price=calcPrice(editing);editing.deposit=Math.round(editing.price*0.2);}
      render();break;
    case 'rmline':readForm();editing.lines.splice(+t.dataset.i,1);if(editing.autoPrice&&editing.lines.length){editing.price=calcPrice(editing);editing.deposit=Math.round(editing.price*0.2);}render();break;
    case 'del':
      if(!t.classList.contains('armed')){t.classList.add('armed');t.textContent='再按一次確認刪除';return;}
      S.orders=S.orders.filter(function(o){return o.id!==editing.id;});editing=null;commit();break;
    case 'io':ioOpen=!ioOpen;render();break;
    case 'copy':copy(JSON.stringify(S.orders),'已複製 '+S.orders.length+' 筆資料');break;
    case 'csv':copy(toCSV(),'已複製 CSV，可直接貼到 Excel');break;
    case 'import':
      var m=document.getElementById('iomsg');
      if(!t.classList.contains('armed')){t.classList.add('armed');t.textContent='確認取代全部資料';return;}
      try{var arr=JSON.parse(document.getElementById('io').value);if(arr.orders)arr=arr.orders;if(!Array.isArray(arr)||!arr.every(function(o){return o&&o.id&&Array.isArray(o.stages);}))throw 0;S.orders=arr;ioOpen=false;commit();}
      catch(err){t.classList.remove('armed');t.textContent='匯入並取代';m.textContent='格式不正確：請貼上用「複製備份」得到的內容。';}
      break;
  }
});

    if(!(window.crypto&&crypto.subtle)){loginErr='這個瀏覽器不支援解鎖，請換一個瀏覽器開啟。';render();return;}
    loginBusy=true;loginErr='';render();var k;
    deriveKey(pw).then(function(key){k=key;return openVault(key);}).then(function(data){S=data;KEY=k;loginBusy=false;location.hash='#board';render();ghSync();},
      function(){loginBusy=false;loginErr='密碼不正確，請再試一次。';render();});
    return;
  }
  if(!unlocked())return;
  var o=readForm();
  if(!o.client||!o.item)return;
  if(!o.id){o.id='o'+Date.now().toString(36);S.orders.push(o);}else{S.orders=S.orders.map(function(x){return x.id===o.id?o:x;});}
  editing=null;commit();
});
function updBal(){var F=document.getElementById('mform');if(!F)return;var fc=document.getElementById('fullcalc');if(fc)fc.textContent=money(+F.querySelector('[name="price"]').value||0);var pr=+F.querySelector('[name="price"]').value||0,dp=Math.round(pr*0.2);document.getElementById('depcalc').textContent=money(dp);document.getElementById('balcalc').textContent=money(pr-dp);}
root.addEventListener('input',function(e){
  if(e.target.id==='hq'){histQ=e.target.value;var pos=e.target.selectionStart;render();var n=document.getElementById('hq');n.focus();n.setSelectionRange(pos,pos);return;}
  if(e.target.name==='kind'){var MF=document.getElementById('mform'),kv=e.target.value;MF.dataset.kind=kv;
    var want=kv==='template'?['完']:kv==='vtuber'?['構','草','線','完','拆']:['構','草','線','完'];
    ALLST.forEach(function(s){var cb=MF.querySelector('input[name="stages"][value="'+s+'"]'),lab=MF.querySelector('[data-dn="'+s+'"]');cb.checked=want.indexOf(s)>=0;lab.hidden=!cb.checked;if(!cb.checked)lab.querySelector('input').checked=false;});
    updBal();}
  if(e.target.name==='price'||e.target.name==='deposit')updBal();
  if(e.target.closest&&e.target.closest('fieldset')&&/^(license|extra|people|rush|autoPrice)$/.test(e.target.name)||e.target.classList.contains('ln-p')||e.target.classList.contains('ln-q'))syncCalc();
  if(e.target.name==='stages'){var lab=document.querySelector('[data-dn="'+e.target.value+'"]');lab.hidden=!e.target.checked;if(!e.target.checked)lab.querySelector('input').checked=false;}
  if(e.target.name==='done'){var vis=Array.prototype.filter.call(document.querySelectorAll('input[name="done"]'),function(x){return !x.closest('label').hidden;});
    var k=vis.indexOf(e.target),on=e.target.checked;vis.forEach(function(x,j){if(on&&j<k)x.checked=true;if(!on&&j>k)x.checked=false;});
    var m=document.getElementById('dnpct');if(m)m.textContent=(vis.length?Math.round(vis.filter(function(x){return x.checked;}).length/vis.length*100):0)+'%';}
});
function copy(txt,msg){var m=document.getElementById('iomsg');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){m.textContent=msg;},function(){fallback();});}else fallback();
  function fallback(){var a=document.getElementById('io');a.value=txt;a.select();m.textContent='已放進上方欄位，請按 Ctrl+C 複製';}}
function toCSV(){
  var cols=['year','client','item','license','price','deposit','depositPaid','balancePaid','orderDate','slot','due','delivered','status','contact','note'];
  var head=['年份','委託人','項目','授權範圍','費用','訂金','訂金已付','尾款已付','填單日','排單','交稿日期','實際交稿','狀態','聯絡','備註'];
  return [head.join('\t')].concat(S.orders.map(function(o){return cols.map(function(c){var v=o[c];if(typeof v==='boolean')v=v?'是':'否';if(c==='status')v=STATUS[v];return String(v==null?'':v).replace(/[\t\n]/g,' ');}).join('\t');})).join('\n');
}

root.addEventListener('focusout',function(e){if(e.target.classList&&e.target.classList.contains('dp')){var v=normDate(e.target.value);if(v)e.target.value=v;}});

keyLoad().then(function(rec){keyDrop();
  if(!rec||!rec.k||!rec.t||Date.now()-rec.t>20000)return;
  return openVault(rec.k).then(function(data){S=data;KEY=rec.k;if(rec.view&&rec.view!=='progress'&&rec.view!=='login')location.hash='#'+rec.view;render();});
}).catch(function(){keyDrop();});
if(window.claude&&window.claude.use){window.claude.use('artifact').then(function(a){artifact=a;}).catch(function(){});}
